<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-server" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="The server room">
  <defs>
    <linearGradient id="srvWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="1" stop-color="#070b14"/></linearGradient>
    <linearGradient id="srvFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101a28"/><stop offset="1" stop-color="#04070c"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <radialGradient id="fireGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a1c" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a1c" stop-opacity="0"/></radialGradient>
    <radialGradient id="vign2" cx=".5" cy=".45" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></radialGradient>
    <pattern id="tiles" width="100" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H100M0 0V40" stroke="rgba(120,160,220,.07)" stroke-width="2"/></pattern>
  </defs>
  <rect width="1600" height="660" fill="url(#srvWall)"/>
  <rect y="660" width="1600" height="240" fill="url(#srvFloor)"/>
  <rect y="660" width="1600" height="240" fill="url(#tiles)"/>
  <rect y="30" width="1600" height="22" fill="#121b2a"/>
  <path d="M0 52 H1600" stroke="#1e2b40" stroke-width="3"/>
  <g stroke="#2a3a55" stroke-width="5" fill="none"><path d="M200 52 q20 60 60 70 t40 60"/><path d="M700 52 q-10 40 30 80"/></g>

  <!-- doorway back to office -->
  <rect x="34" y="272" width="164" height="390" fill="#0a0d12"/>
  <rect x="46" y="284" width="140" height="378" fill="#c48c45" opacity=".5"/>
  <path d="M46 662 L186 662 L260 900 L-40 900Z" fill="#c48c45" opacity=".08"/>
  <text x="116" y="250" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="16" fill="#c9b78f">← OFFICE</text>

  <!-- rack -->
  <rect x="296" y="112" width="338" height="572" rx="4" fill="#0e131b" stroke="#2b3647" stroke-width="3"/>
  <rect x="336" y="146" width="258" height="86" rx="3" fill="#020604" stroke="#2a3a33" stroke-width="3"/>
  <text id="rack-text" x="465" y="198" text-anchor="middle" font-family="VT323, monospace" font-size="30" fill="#1e3a26">NO SIGNAL</text>
  <g id="rack" class="dead"></g>
  <!-- hex sticky -->
  <g transform="rotate(5 690 340)"><rect x="644" y="296" width="92" height="88" fill="#f7e36b"/><text x="690" y="332" text-anchor="middle" font-family="Caveat, cursive" font-size="24" font-weight="700" fill="#2a2a2a">HEX?</text><text x="690" y="360" text-anchor="middle" font-family="Caveat, cursive" font-size="16" fill="#555">read me Roy</text></g>

  <!-- logic / breaker panel -->
  <ellipse id="fire-wallglow" cx="930" cy="520" rx="260" ry="200" fill="url(#fireGlow)" class="pulse"/>
  <rect x="790" y="196" width="300" height="268" rx="6" fill="#4b5157" stroke="#6b737b" stroke-width="3"/>
  <rect x="806" y="212" width="268" height="26" fill="#f1c232"/>
  <text x="940" y="230" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="13" fill="#1a1a1a">BREAKER · LOGIC RESET</text>
  <g stroke="#2a2f35" stroke-width="5" fill="none"><path d="M830 280h60v40h40M830 340h60v-20M830 400h100M930 300h40v60h50"/></g>
  <g fill="#1b1f24" stroke="#8b939c" stroke-width="2"><rect x="880" y="290" width="46" height="40"/><rect x="930" y="380" width="46" height="40"/><rect x="990" y="336" width="46" height="50"/></g>
  <circle id="panel-lamp" cx="1062" cy="440" r="10" fill="#ff3b30" class="blink"/>

  <!-- bin fire -->
  <g id="fire-vis">
    <path d="M868 590 h120 l-12 110 h-96z" fill="#3c4148" stroke="#22262b" stroke-width="3"/>
    <path class="flame" d="M880 596 q10 -70 40 -100 q-6 50 22 60 q8 -40 34 -60 q10 60 0 100z" fill="#ff6a1c"/>
    <path class="flame b" d="M896 596 q8 -44 28 -66 q0 34 18 40 q6 -26 22 -36 q6 40 -4 62z" fill="#ffc23a"/>
    <path class="flame" d="M914 596 q6 -20 14 -30 q2 16 10 18 q4 -10 10 -14 q2 18 -4 26z" fill="#fff2b0"/>
  </g>
  <g id="bin-out" style="display:none">
    <!-- the fire is out: extinguisher foam on and around a scorched bin, and a last wisp of smoke -->
    <g fill="#c9d0d5" stroke="#9aa4ab" stroke-width="2">
      <path d="M828 704 q-4 -14 14 -16 q6 -12 22 -6 l128 0 q14 -8 24 4 q18 0 14 16 q-2 10 -16 10 h-170 q-14 0 -16 -8z"/>
      <circle cx="1012" cy="694" r="7"/><circle cx="836" cy="694" r="6"/>
    </g>
    <path d="M868 590 h120 l-12 110 h-96z" fill="#3c4148" stroke="#22262b" stroke-width="3"/>
    <path d="M870 592 h116 l-2 18 h-112z" fill="#1d2024" opacity=".85"/>
    <path d="M872 612 l6 40 l8 -28 l6 36 l4 -46z M954 612 l6 30 l6 -22 l8 26 l2 -34z" fill="#1d2024" opacity=".55"/>
    <g fill="#e4e9ec" stroke="#aeb7be" stroke-width="2">
      <path d="M906 600 q-4 22 6 26 q8 2 6 -12z"/><path d="M958 600 q2 30 10 32 q8 -2 2 -22z"/>
      <circle cx="878" cy="592" r="12"/><circle cx="900" cy="584" r="15"/><circle cx="926" cy="580" r="17"/>
      <circle cx="952" cy="584" r="15"/><circle cx="976" cy="592" r="12"/><circle cx="914" cy="570" r="10"/><circle cx="940" cy="568" r="11"/>
    </g>
    <path d="M930 556 q-10 -18 4 -32 q12 -12 2 -30" stroke="#b5bdc3" stroke-width="6" fill="none" stroke-linecap="round" opacity=".22"/>
  </g>

  <!-- the internet -->
  <path d="M1270 0 L1180 700 L1360 700 Z" fill="url(#beam)"/>
  <rect x="1200" y="484" width="140" height="196" fill="#151b24" stroke="#2b3647" stroke-width="3"/>
  <rect x="1222" y="540" width="96" height="30" fill="#c9a24a"/>
  <text x="1270" y="553" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" font-weight="600" fill="#1a1a1a">THE INTERNET</text>
  <text x="1270" y="565" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7" fill="#1a1a1a">DO NOT TOUCH</text>
  <rect x="1228" y="430" width="84" height="54" rx="3" fill="#050505"/>
  <circle cx="1298" cy="444" r="5" fill="#ff2a2a" class="pulse"/>
  <path d="M1210 484 v-70 q0 -50 60 -50 q60 0 60 50 v70" fill="rgba(200,230,255,.05)" stroke="rgba(220,240,255,.35)" stroke-width="2"/>
  <path d="M1222 420 q4 -40 36 -46" stroke="rgba(255,255,255,.45)" stroke-width="3" fill="none"/>

  <!-- cables -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M620 684 q60 60 180 40 t220 30 t160 -20" stroke="#2f6fb5"/>
    <path d="M600 684 q80 90 240 70 t300 10" stroke="#c8262c"/>
    <path d="M640 684 q30 120 200 110 t180 -30" stroke="#d9b62a"/>
  </g>
  <rect width="1600" height="900" fill="url(#vign2)" pointer-events="none"/>

  <g>
    <rect class="hit" fill="transparent" data-hs="back" data-label="Back to the office" x="34" y="232" width="170" height="430"/>
    <rect class="hit" fill="transparent" data-hs="display" data-label="Rack display" x="334" y="144" width="262" height="90"/>
    <rect class="hit" fill="transparent" data-hs="rack" data-label="Server rack" x="296" y="236" width="338" height="448"/>
    <rect class="hit" fill="transparent" data-hs="hex" data-label="Sticky note" x="640" y="292" width="102" height="98"/>
    <rect class="hit" fill="transparent" data-hs="panel" data-label="Breaker panel" x="788" y="194" width="304" height="272"/>
    <rect class="hit" fill="transparent" data-hs="fire" data-label="Burning bin" x="862" y="480" width="132" height="224" id="hit-fire"/>
    <rect class="hit" fill="transparent" data-hs="internet" data-label="The Internet" x="1198" y="360" width="146" height="322"/>
    <rect class="hit" fill="transparent" data-hs="cables" data-label="Cables" x="660" y="720" width="480" height="100"/>
  </g>
</svg>
