  <text x="475" y="202" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#cfc3f0">DUNGEONS &amp;</text>
  <text x="475" y="218" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#cfc3f0">DATACENTERS</text>

