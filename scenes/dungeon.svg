    <g font-family="Caveat, cursive" font-size="20" fill="#e8c766" opacity=".8"><text x="1070" y="560">ᚱ ᛗ ᛟ</text><text x="1150" y="560">ᛇ ᚹ ᛞ</text></g>
  </g>
