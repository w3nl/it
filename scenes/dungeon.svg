  <rect x="1520" y="64" width="40" height="26" rx="5" fill="#222"/><circle cx="1540" cy="77" r="7" fill="#444"/><circle cx="1555" cy="70" r="3" fill="#ff3b30" class="blink"/>

  <rect width="1600" height="900" fill="url(#vign6)" pointer-events="none"/>

  <g>
