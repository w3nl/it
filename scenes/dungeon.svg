<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-dungeon" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Moss's escape room: Dungeons and Datacenters">
  <defs>
    <linearGradient id="dgWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4740"/><stop offset="1" stop-color="#2e2c27"/></linearGradient>
    <pattern id="stones" width="120" height="70" patternUnits="userSpaceOnUse"><path d="M0 0H120M0 35H120M0 0V35M60 35V70" stroke="rgba(0,0,0,.35)" stroke-width="4" fill="none"/><rect x="8" y="6" width="44" height="22" fill="rgba(255,255,255,.03)"/></pattern>
    <linearGradient id="dgFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3024"/><stop offset="1" stop-color="#16120d"/></linearGradient>
    <radialGradient id="torchG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".45"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <pattern id="bricks" width="40" height="24" patternUnits="userSpaceOnUse"><rect width="40" height="24" fill="#a3402a"/><path d="M0 0H40M0 12H40M0 0V12M20 12V24" stroke="#5e2216" stroke-width="2"/></pattern>
    <linearGradient id="wood5" x1="0" x2="1"><stop offset="0" stop-color="#7a5434"/><stop offset="1" stop-color="#5a3b22"/></linearGradient>
    <radialGradient id="vign6" cx=".5" cy=".45" r=".75"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
  </defs>
  <rect width="1600" height="640" fill="url(#dgWall)"/>
  <rect width="1600" height="640" fill="url(#stones)"/>
  <rect width="1600" height="34" fill="#15160f"/><rect y="40" width="1600" height="14" rx="7" fill="#6a5634"/>
  <path d="M120 54 l14 40 M680 54 l-10 36 M1300 54 l8 30" stroke="#c9b78f" stroke-width="10" opacity=".5"/>
  <rect y="628" width="1600" height="14" fill="#15130e"/>
  <rect y="642" width="1600" height="258" fill="url(#dgFloor)"/>

  <!-- torches -->
  <g><ellipse cx="300" cy="190" rx="110" ry="90" fill="url(#torchG)" class="flick"/><rect x="292" y="196" width="16" height="44" fill="#3a2a1a"/><path class="flame" d="M288 198 q12 -40 12 -40 q14 26 12 40z" fill="#ffb347"/></g>
  <g><ellipse cx="1260" cy="190" rx="110" ry="90" fill="url(#torchG)" class="flick"/><rect x="1252" y="196" width="16" height="44" fill="#3a2a1a"/><path class="flame b" d="M1248 198 q12 -40 12 -40 q14 26 12 40z" fill="#ffb347"/></g>

  <!-- the Firewall (exit) -->
  <rect x="58" y="240" width="204" height="402" fill="#120e0a"/>
