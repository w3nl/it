    <rect x="86" y="268" width="148" height="38" fill="#f1e3c8" transform="rotate(-2 160 287)"/>
    <text x="160" y="294" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="22" fill="#8a1c12" transform="rotate(-2 160 287)">THE FIREWALL</text>
    <g fill="#ff7a1a"><path class="flame" d="M74 642 q14 -70 28 -90 q4 40 18 46 q6 -34 20 -50 q8 48 4 94z"/><path class="flame b" d="M140 642 q10 -60 26 -84 q4 34 16 40 q8 -30 22 -44 q6 50 0 88z"/><path class="flame" d="M196 642 q8 -50 24 -70 q6 30 16 34 q6 -16 12 -24 q4 34 -4 60z"/></g>
