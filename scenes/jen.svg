  <g fill="#222"><rect x="1490" y="540" width="18" height="58" rx="3"/><rect x="1516" y="540" width="18" height="58" rx="3"/></g>

  <rect width="1600" height="900" fill="url(#vign3)" pointer-events="none"/>

  <g>
