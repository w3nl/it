    <rect x="712" y="72" width="276" height="96" fill="#b7bfbd"/>
    <rect x="712" y="72" width="276" height="20" fill="#9aa4a3"/>
    <rect x="712" y="112" width="276" height="56" fill="#7d8786"/>
    <path d="M712 112h276M760 112l-10 56M840 112l-6 56M920 112l4 56" stroke="#69716f" stroke-width="2"/>
    <!-- passers-by: their legs run off the top of the window, so the rest of them is up on the street -->
    <g class="walk">
      <g class="leg"><rect x="700" y="30" width="15" height="104" fill="#2a2a3a"/><path d="M696 140h27v-5q-2-7-11-7h-12z" fill="#111"/></g>
      <g class="leg back"><rect x="717" y="30" width="15" height="104" fill="#22222f"/><path d="M713 140h27v-5q-2-7-11-7h-12z" fill="#111"/></g>
      <path d="M736 40 L783 123" stroke="#c8262c" stroke-width="2.5"/>
      <g class="dog">
        <ellipse cx="770" cy="129" rx="17" ry="7" fill="#8a5a2a"/>
        <circle cx="787" cy="123" r="7" fill="#8a5a2a"/><path d="M791 124h7l-2 4h-5z" fill="#6b4420"/><path d="M782 119q-4 8 1 11" stroke="#6b4420" stroke-width="4" fill="none"/>
        <circle cx="789" cy="121" r="1.4" fill="#111"/><rect x="782" y="126" width="6" height="2.5" fill="#c8262c"/>
        <path d="M753 127q-8-6-10-12" stroke="#8a5a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <g fill="#6b4420"><rect x="758" y="133" width="4" height="7"/><rect x="779" y="133" width="4" height="7"/></g>
      </g>
    </g>
    <g class="walk b">
      <rect x="692" y="40" width="48" height="42" rx="6" fill="#1a1a22"/>
      <g class="leg"><rect x="703" y="70" width="9" height="62" fill="#e9c9b0"/><path d="M699 140h20l-2-9h-11z" fill="#c8262c"/><rect x="700" y="131" width="3" height="9" fill="#c8262c"/></g>
      <g class="leg back"><rect x="720" y="70" width="9" height="62" fill="#ddbca2"/><path d="M716 140h20l-2-9h-11z" fill="#c8262c"/><rect x="717" y="131" width="3" height="9" fill="#c8262c"/></g>
    </g>
