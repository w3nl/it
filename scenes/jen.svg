    <rect x="1342" y="292" width="100" height="68" fill="#222"/><path d="M1342 304h100" stroke="rgba(255,255,255,.15)" stroke-width="2"/><text x="1392" y="338" fill="#fff">BELLADONNA</text>
    <rect x="1454" y="292" width="100" height="68" fill="#f1e3c8"/><path d="M1454 304h100" stroke="rgba(0,0,0,.15)" stroke-width="2"/><text x="1504" y="338" fill="#333">BELLADONNA</text>
    <rect x="1230" y="412" width="100" height="68" fill="#c9a24a"/><path d="M1230 424h100" stroke="rgba(0,0,0,.2)" stroke-width="2"/><text x="1280" y="458" fill="#222">BELLADONNA</text>
    <rect x="1342" y="412" width="100" height="68" fill="#d6336c"/><path d="M1342 424h100" stroke="rgba(0,0,0,.2)" stroke-width="2"/><text x="1392" y="458" fill="#fff">BELLADONNA</text>
    <rect x="1454" y="424" width="100" height="56" fill="#74e04b" transform="rotate(-3 1504 452)"/><text x="1504" y="458" fill="#1a3a10" font-size="13">CROCS</text>
