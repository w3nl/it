  <path d="M1094 212h26l-4 12h-18z" fill="#fff"/>
  <text x="1107" y="250" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="16" fill="#fff">KEEP</text>
