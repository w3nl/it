<svg xmlns="http://www.w3.org/2000/svg" class="scene" id="sc-jen" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="Jen's office">
  <defs>
    <linearGradient id="jWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3846"/><stop offset="1" stop-color="#2b2028"/></linearGradient>
    <pattern id="jStripe" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="32" height="64" fill="rgba(255,255,255,.035)"/></pattern>
    <linearGradient id="jFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1f3a3a"/><stop offset="1" stop-color="#0b1616"/></linearGradient>
    <linearGradient id="jWood" x1="0" x2="1"><stop offset="0" stop-color="#7a5a3a"/><stop offset="1" stop-color="#5e4229"/></linearGradient>
    <radialGradient id="jLamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb3d1" stop-opacity=".5"/><stop offset="1" stop-color="#ffb3d1" stop-opacity="0"/></radialGradient>
    <radialGradient id="jScreen" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#c58aff" stop-opacity=".5"/><stop offset="1" stop-color="#c58aff" stop-opacity="0"/></radialGradient>
    <radialGradient id="lockGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3aa0ff" stop-opacity=".45"/><stop offset="1" stop-color="#3aa0ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="lapG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9ac6"/><stop offset="1" stop-color="#8a5cf6"/></linearGradient>
    <linearGradient id="dayBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfe8e4" stop-opacity=".16"/><stop offset="1" stop-color="#dfe8e4" stop-opacity="0"/></linearGradient>
    <radialGradient id="vign3" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".7"/></radialGradient>
    <clipPath id="winClip"><rect x="712" y="72" width="276" height="96"/></clipPath>
  </defs>

  <rect width="1600" height="640" fill="url(#jWall)"/>
  <rect width="1600" height="640" fill="url(#jStripe)"/>
  <rect width="1600" height="34" fill="#1d151b"/>
  <rect y="40" width="1600" height="12" rx="6" fill="#5a4a3a"/>
  <rect y="628" width="1600" height="14" fill="#1a1216"/>
  <rect y="642" width="1600" height="258" fill="url(#jFloor)"/>
  <ellipse cx="900" cy="760" rx="380" ry="60" fill="#d6336c" opacity=".08"/>

  <!-- basement window with passing feet -->
  <rect x="700" y="60" width="300" height="120" fill="#1a1418"/>
  <g clip-path="url(#winClip)">
