    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c241c"/><stop offset="1" stop-color="#120e0a"/></linearGradient>
    <radialGradient id="lampG" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".35"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="vign" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <radialGradient id="bsodGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#3d6bff" stop-opacity=".45"/><stop offset="1" stop-color="#3d6bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="exitGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5dff8a" stop-opacity=".35"/><stop offset="1" stop-color="#5dff8a" stop-opacity="0"/></radialGradient>
    <linearGradient id="metalDoor" x1="0" x2="1"><stop offset="0" stop-color="#55605a"/><stop offset="1" stop-color="#3f4843"/></linearGradient>
    <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#6d4a2e"/><stop offset="1" stop-color="#553822"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

